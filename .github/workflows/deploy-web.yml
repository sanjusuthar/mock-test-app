name: Deploy Website to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inject Firebase Secrets into index.html
        env:
          FB_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FB_DB: ${{ secrets.FIREBASE_DATABASE_URL }}
        run: |
          python3 -c '
          import os
          s = open("index.html", encoding="utf-8").read()
          s = s.replace("YOUR_FIREBASE_API_KEY", os.environ["FB_KEY"])
          s = s.replace("YOUR_FIREBASE_DATABASE_URL", os.environ["FB_DB"])
          open("index.html", "w", encoding="utf-8").write(s)
          '

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
