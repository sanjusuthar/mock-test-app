  <style>
    :root {
      --bg-top: #050C24;
      --bg-mid: #09153E;
      --bg-bot: #04091A;
      --card: #0E1B3D;
      --card-dark: #18181B;
      --rose: #E11D48;
      --sky: #0EA5E9;
      --cyan: #00F0FF;
      --gold: #F59E0B;
      --green: #10B981;
      --red: #EF4444;
      --purple: #8B5CF6;
      --text: #F8FAFC;
      --muted: #94A3B8;
      --border: rgba(14, 165, 233, 0.28);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
      overscroll-behavior-y: contain;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Devanagari", sans-serif;
      background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 50%, var(--bg-bot) 100%);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .app-shell {
      max-width: 540px;
      margin: 0 auto;
      min-height: 100vh;
      padding: 12px 14px 96px 14px;
      position: relative;
    }

    /* Header */
    .top-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      color: #fff;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
    }
    .circle-btn { border-radius: 50%; }
    .bell-badge {
      position: absolute;
      top: -3px;
      right: -3px;
      background: var(--rose);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      min-width: 17px;
      height: 17px;
      border-radius: 99px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
    }
    .brand-center { text-align: center; }
    .brand-row { display: flex; align-items: center; justify-content: center; gap: 6px; }
    .brand-title { font-size: 18px; font-weight: 900; line-height: 1.05; text-align: left; }
    .brand-title span { display: block; color: var(--rose); font-size: 19px; }
    .brand-sub { font-size: 10px; color: #CBD5E1; font-weight: 600; margin-top: 2px; }

      border-radius: 20px;
      padding: 16px;

    .hero-h1 { font-size: 19px; font-weight: 800; }
    .hero-h2 { font-size: 21px; font-weight: 900; color: var(--gold); margin-bottom: 8px; }
    .pill-rose {
      display: inline-block;
      background: linear-gradient(90deg, var(--rose), #BE123C);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 99px;
      margin-bottom: 6px;
    }
    .hero-exams { font-size: 10.5px; font-weight: 800; color: #E2E8F0; margin-bottom: 12px; }
    .btn-gold {
      background: linear-gradient(90deg, #FACC15, #F59E0B);
      color: #09090B;
      border: none;
      border-radius: 99px;
      padding: 8px 16px;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* Quick 4 Tiles */
    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }
    .quick-tile {
      background: linear-gradient(180deg, #132046, #0B132B);
      border: 1px solid rgba(14, 165, 233, 0.35);
      border-radius: 16px;
      padding: 12px 4px;
      text-align: center;
      cursor: pointer;
    }
    .quick-icon {
      width: 42px;
      height: 42px;
      margin: 0 auto 6px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      border: 1.5px solid rgba(255,255,255,0.55);
    }
    .quick-label { font-size: 11px; font-weight: 700; color: #fff; }

    /* Section Title */
    .sec-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .sec-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 800;
    }
    .sec-bar { width: 4px; height: 18px; border-radius: 3px; background: var(--rose); }
    .sec-link { font-size: 12.5px; font-weight: 700; color: var(--sky); cursor: pointer; }

    /* Popular Exam White Cards */
    .exam-card {
      background: #fff;
      color: #0F172A;
      border-radius: 14px;
      padding: 10px 5px;
      text-align: center;
      cursor: pointer;
      border-bottom: 3px solid var(--rose);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 102px;
    }
    .exam-emblem { font-size: 22px; }
    .exam-code { font-size: 12.5px; font-weight: 900; margin: 3px 0; }
    .exam-sub { font-size: 8.5px; color: #334155; line-height: 1.2; font-weight: 600; }

    /* Split 2 Cards */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .split-card {

      .opt-card:hover { border-color: var(--sky); background: rgba(14, 165, 233, 0.1); }

    @media print {

    /* Test Description (3-line clamp) */

      const num = String(Math.abs(h) % 900000 + 100000);

    function escHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/\n/g, "<br>");
    }

    function escHtmlWithLinks(str, linkColor = "#38bdf8") {
      const escaped = escHtml(str);
      return escaped.replace(/https?:\/\/[^\s<]+/gi, (raw) => {
        const clean = raw.replace(/[.,);:\]]+$/, "");
        const trailing = raw.slice(clean.length);
        return `<a href="${clean}" target="_blank" rel="noopener noreferrer" style="color:${linkColor};text-decoration:underline;word-break:break-all;">${clean}</a>${trailing}`;
      });

      if (!isFirebaseConfigured() || !state.auth || !state.auth.refreshToken) return state.auth?.idToken || null;
      try {
        const res = await fetch(`https://securetoken.googleapis.com/v1/token?key=${encodeURIComponent(FIREBASE_API_KEY)}`, {

          body: `grant_type=refresh_token&refresh_token=${encodeURIComponent(state.auth.refreshToken)}`

        const data = await res.json();
        if (res.ok && data.id_token) {

          state.auth.uid = data.user_id || state.auth.uid;

    // ==================== 3. BROWSER AES-256-CBC DECRYPTION (ENCv1:) ====================
    async function decryptQuizContent(content) {
      const trimmed = String(content || "").trim();
      if (!trimmed.startsWith("ENCv1:")) return content;

      const b64 = trimmed.slice(6).replace(/\s+/g, "");
      const binStr = atob(b64);
      const bytes = new Uint8Array(binStr.length);
      for (let i = 0; i < binStr.length; i++) bytes[i] = binStr.charCodeAt(i);

      const iv = bytes.slice(0, 16);
      const ciphertext = bytes.slice(16);

      const passBytes = new TextEncoder().encode(QUIZ_SECRET_PASSPHRASE);
      const keyHash = await crypto.subtle.digest("SHA-256", passBytes);
      const cryptoKey = await crypto.subtle.importKey(
        "raw",
        keyHash,
        { name: "AES-CBC" },
        false,
        ["decrypt"]
      );
      const decryptedBuf = await crypto.subtle.decrypt(
        { name: "AES-CBC", iv },
        cryptoKey,
        ciphertext
      );
      return new TextDecoder("utf-8").decode(decryptedBuf);
    }

    // ==================== 4. STRICT MULTI-LINE TXT QUESTION PARSER ====================
    function parseQuizTxt(rawText) {
      if (!rawText || !rawText.trim()) return { questions: [], warnings: [] };
      const parsed = [];
      const warnings = [];
      const normalized = rawText
        .replace(/\r\n/g, "\n")
        .replace(/\r/g, "\n")
        .replace(/([^\n])(\s*TOPIC\s*:)/gi, "$1\n$2");

      let pendingTopic = "General";
      let qTopic = "General";
      let qText = "";
      let options = [];
      let answerIndex = null;
      let solution = "व्याख्या उपलब्ध नहीं है।";
      let currentField = "NONE";

      function flush() {
        if (qText.trim() && options.length >= 2) {
          const cleanSol = solution.replace(/\n?TOPIC\s*:.*$/i, "").replace(/<br>/g, "\n").trim();
          if (answerIndex === null || answerIndex < 0 || answerIndex >= options.length) {
            warnings.push(`Q${parsed.length + 1}: ANS: गलत या गायब है`);
          } else {
            parsed.push({
              topic: qTopic.trim() || "General",
              text: qText.replace(/<br>/g, "\n").trim(),
              options: options.map(o => o.trim()),
              correctAnswer: answerIndex,
              solution: cleanSol || "व्याख्या उपलब्ध नहीं है।"
            });
          }
        }
        qText = "";
        options = [];
        answerIndex = null;
        solution = "व्याख्या उपलब्ध नहीं है।";
        currentField = "NONE";
      }

      const topicRx = /^TOPIC\s*:\s*(.*)/i;
      const qRx = /^(?:Q|Question|प्र|प्रश्न)\s*[:.]\s*(.*)/i;
      const optRx = /^([A-E])[).:-]\s*(.*)/i;
      const ansRx = /^(?:ANS|Answer|उत्तर)\s*[:.-]\s*(.*)/i;
      const solRx = /^(?:SOL|SOLUTION|व्याख्या)\s*[:.-]\s*(.*)/i;
      const ansMap = { A: 0, B: 1, C: 2, D: 3, E: 4 };

      for (const rawLine of normalized.split("\n")) {
        const line = rawLine.trim();
        if (!line) continue;

        const mTopic = line.match(topicRx);
        const mQ = line.match(qRx);
        const mOpt = line.match(optRx);
        const mAns = line.match(ansRx);
        const mSol = line.match(solRx);

        if (mTopic) {
          if (qText.trim()) flush();
          pendingTopic = mTopic[1].trim() || "General";
          currentField = "TOPIC";
        } else if (mQ) {
          if (qText.trim()) flush();
          qTopic = pendingTopic;
          qText = mQ[1].trim();
          currentField = "Q";
        } else if (mOpt && (currentField === "Q" || currentField === "OPT")) {
          options.push(mOpt[2].trim());
          currentField = "OPT";
        } else if (mAns && options.length > 0) {
          const tok = mAns[1].trim().toUpperCase();
          const mTok = tok.match(/([A-E]|[1-5])/);
          const ch = mTok ? mTok[1] : "";
          if (ch in ansMap) answerIndex = ansMap[ch];
          else if (ch && !isNaN(parseInt(ch, 10))) answerIndex = parseInt(ch, 10) - 1;
          currentField = "ANS";
        } else if (mSol && options.length > 0) {
          solution = mSol[1].trim();
          currentField = "SOL";
        } else {
          if (currentField === "TOPIC") pendingTopic = `${pendingTopic} ${line}`.trim();
          else if (currentField === "Q") qText = qText ? `${qText}\n${line}` : line;
          else if (currentField === "OPT" && options.length > 0) options[options.length - 1] += " " + line;
          else if (currentField === "SOL") {
            solution = (solution === "व्याख्या उपलब्ध नहीं है।" || !solution) ? line : `${solution}\n${line}`;
          }
        }
      }
      if (qText.trim()) flush();
      return { questions: parsed, warnings };
    }

    // ==================== 5. GITHUB CLOUD SYNC ====================
    async function fetchOnlineQuizzes() {
      state.isLoadingOnline = true;
      render();
      let itemsList = null;

      // 1. Primary: Load securely from Firebase Realtime Database (requires verified login)
      if (isFirebaseConfigured() && state.auth?.uid) {
        try {
          const token = await fbRefreshTokenIfNeeded();
          if (token) {
            const fbRes = await fetch(`${cleanDbUrl()}/quizzes_index.json?auth=${encodeURIComponent(token)}`, { cache: "no-store" });
            if (fbRes.ok) {
              const fbData = await fbRes.json();
              if (fbData && typeof fbData === "object") {
                const arr = Object.values(fbData).filter(Boolean).map(o => ({ ...o, fileUrl: "firebase", source: "firebase" }));
                if (arr.length > 0) {
                  itemsList = arr;
                  localStorage.setItem(LS_INDEX_CACHE, JSON.stringify(arr));
                }
              }
            } else if (fbRes.status === 401 || fbRes.status === 403) {
              showToast("सेशन समाप्त या Email अनवेरिफाइड है—कृपया दोबारा Login करें।");
            }
          }
        } catch {}
      }

      // 3. Offline Cache Fallback
      if (!itemsList) {
        try {
          const cached = localStorage.getItem(LS_INDEX_CACHE);
          if (cached) itemsList = JSON.parse(cached);
        } catch {}
      }

      if (Array.isArray(itemsList)) {
        state.onlineQuizzes = itemsList.map((obj, idx) => {
          const rawSubject = String(obj.subject || "").trim();
          const rawTitle = String(obj.title || "Mock Test");
          const rawExam = String(obj.examName || "").trim();
          const resolvedExam = rawExam
            ? normalizeExamCode(rawExam)
            : (rawSubject.toUpperCase().includes("CTET") || rawTitle.toUpperCase().includes("CTET") ? "CTET" : (rawSubject.toUpperCase().includes("HTET") || rawTitle.toUpperCase().includes("HTET") ? "HTET" : "RPSC"));
          return {
            id: obj.id || `quiz_${idx}`,
            title: rawTitle,
            subtitle: obj.subtitle || "Online Practice Test",
            examName: resolvedExam,
            subject: rawSubject || "General Tests",
            timeMinutes: Number(obj.timeMinutes || 60),
            marksPerCorrect: Number(obj.marksPerCorrect || 2.0),
            negativeMark: Number(obj.negativeMark || 0.0),
            questionCount: Number(obj.questionCount || 0),
            fileUrl: obj.fileUrl || (obj.source === "firebase" ? "firebase" : ""),
            publishedDate: obj.publishedDate || ""
          };
        }).sort((a, b) => {
          const ta = Number(String(a.id).split("quiz_")[1]) || 0;
          const tb = Number(String(b.id).split("quiz_")[1]) || 0;
          return ta - tb;
        });
      }

      state.isLoadingOnline = false;
      render();
    }

    async function launchOnlineQuiz(meta) {
      try {
        let plainTxt = "";

        // 1. Try Firebase Realtime Database first (secured behind verified login)
        if (isFirebaseConfigured() && state.auth?.uid) {
          try {
            const token = await fbRefreshTokenIfNeeded();
            if (token) {
              const res = await fetch(`${cleanDbUrl()}/quizzes_content/${encodeURIComponent(meta.id)}.json?auth=${encodeURIComponent(token)}`, { cache: "no-store" });
              if (res.ok) {
                const data = await res.json();
                const content = typeof data === "string" ? data : (data?.rawTxt || "");
                if (content) {
                  plainTxt = await decryptQuizContent(content);
                  localStorage.setItem(LS_QUIZ_CACHE_PREFIX + meta.id + "_plain", plainTxt);
                }
              }
            }
          } catch {}
        }

        // 2. Fallback to GitHub URL or local cache
        if (!plainTxt && meta.fileUrl && meta.fileUrl !== "firebase") {
          const sep = meta.fileUrl.includes("?") ? "&" : "?";
          try {
            const res = await fetch(`${meta.fileUrl}${sep}t=${Date.now()}`, { cache: "no-store" });
            if (res.ok) {
              const rawDownloaded = await res.text();
              localStorage.setItem(LS_QUIZ_CACHE_PREFIX + meta.id, rawDownloaded);
              plainTxt = await decryptQuizContent(rawDownloaded);
              localStorage.setItem(LS_QUIZ_CACHE_PREFIX + meta.id + "_plain", plainTxt);
            }
          } catch {}
        }

        if (!plainTxt) {
          plainTxt = localStorage.getItem(LS_QUIZ_CACHE_PREFIX + meta.id + "_plain") || "";
          if (!plainTxt) {
            const rawCached = localStorage.getItem(LS_QUIZ_CACHE_PREFIX + meta.id) || "";
            if (rawCached) plainTxt = await decryptQuizContent(rawCached);
          }
        }

        if (!plainTxt) {
          throw new Error("टेस्ट डेटा उपलब्ध नहीं है। कृपया इंटरनेट और लॉगिन जांचें।");
        }

        const parsed = parseQuizTxt(plainTxt).questions;
        if (!parsed.length) {
          alert("टेस्ट फाइल में कोई मान्य प्रश्न नहीं मिला।");
          return;
        }
        startExamSession(meta, parsed, plainTxt);
      } catch (e) {
        alert("टेस्ट लोड नहीं हो सका: " + e.message);
      }
    }

    function startExamSession(config, questions, plainTxt) {
      stopTimer();
      state.prevScreen = state.screen;
      state.isPaused = false;
      state.activeTest = {
        config,
        questions,
        rawTxt: plainTxt,
        currentQ: 0,
        answers: new Array(questions.length).fill(null),
        review: new Array(questions.length).fill(false),
        remainingSec: config.timeMinutes * 60
      };
      persistResume();
      try { sessionStorage.setItem("web_mock_active_test", "1"); } catch {}
      state.screen = "TEST";
      pushNavHistory("TEST");
      startTimer();
      render();
    }

    function startTimer() {
      stopTimer();
      state.isPaused = false;
      state.timerInterval = setInterval(() => {
        if (state.screen !== "TEST" || !state.activeTest || state.isPaused) return;
        if (state.activeTest.remainingSec > 0) {
          state.activeTest.remainingSec--;
          if (state.activeTest.remainingSec % 5 === 0) persistResume();
          const el = document.getElementById("live-timer-text");
          if (el) el.textContent = formatMMSS(state.activeTest.remainingSec);
          if (state.activeTest.remainingSec <= 0) {
            finishExam();
          }
        }
      }, 1000);
    }

    function stopTimer() {
      if (state.timerInterval) {
        clearInterval(state.timerInterval);
        state.timerInterval = null;
      }
    }

    function persistResume() {
      if (!state.activeTest) return;
      const t = state.activeTest;
      saveJson(LS_RESUME, {
        config: t.config,
        currentQ: t.currentQ,
        remainingSec: t.remainingSec,
        answers: t.answers,
        review: t.review
      });
      state.resumeState = loadJson(LS_RESUME, null);
    }

    function finishExam() {
      if (state.screen === "RESULT" || !state.activeTest) return;
      stopTimer();
      const t = state.activeTest;
      const spent = Math.max(0, t.config.timeMinutes * 60 - t.remainingSec);
      let correct = 0, wrong = 0, skipped = 0;
      t.questions.forEach((q, i) => {
        const a = t.answers[i];
        if (a === null) skipped++;
        else if (a === q.correctAnswer) correct++;
        else wrong++;
      });
      const obtained = correct * t.config.marksPerCorrect - wrong * t.config.negativeMark;
      const maxM = t.questions.length * t.config.marksPerCorrect;
      const pct = maxM > 0 ? Math.max(0, Math.min(100, (obtained / maxM) * 100)) : 0;
      const dateStr = new Date().toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });

      try {
        localStorage.setItem(LS_QUIZ_CACHE_PREFIX + t.config.id + "_plain", t.rawTxt);
      } catch {}

      const list = state.attemptsMap[t.config.id] || [];
      list.push({
        attemptNumber: list.length + 1,
        config: t.config,
        answers: t.answers,
        spentSec: spent,
        obtainedMarks: obtained,
        maxMarks: maxM,
        percentage: pct,
        completedDate: dateStr,
        completedAtMillis: Date.now(),
        correctCount: correct,
        wrongCount: wrong,
        skippedCount: skipped
      });
      state.attemptsMap[t.config.id] = list;
      saveJson(LS_ATTEMPTS, state.attemptsMap);
      fbPushProfileAndAttempts();

      localStorage.removeItem(LS_RESUME);
      try { sessionStorage.removeItem("web_mock_active_test"); } catch {}
      state.resumeState = null;
      state.resultData = {
        config: t.config,
        questions: t.questions,
        answers: t.answers,
        spentSec: spent
      };
      state.screen = "RESULT";
      pushNavHistory("RESULT");
      render();
    }

    async function ensureQuizPlainText(quizId) {
      let plain = localStorage.getItem(LS_QUIZ_CACHE_PREFIX + quizId + "_plain") || "";
      if (plain) return plain;
      if (isFirebaseConfigured() && state.auth?.uid) {
        try {
          showToast("क्लाउड से प्रश्न लोड हो रहे हैं...");
          const token = await fbRefreshTokenIfNeeded();
          if (token) {
            const res = await fetch(`${cleanDbUrl()}/quizzes_content/${encodeURIComponent(quizId)}.json?auth=${encodeURIComponent(token)}`, { cache: "no-store" });
            if (res.ok) {
              const data = await res.json();
              const content = typeof data === "string" ? data : (data?.rawTxt || "");
              if (content) {
                plain = await decryptQuizContent(content);
                localStorage.setItem(LS_QUIZ_CACHE_PREFIX + quizId + "_plain", plain);
                return plain;
              }
            }
          }
        } catch {}
      }
      return "";
    }

    async function openSavedAttempt(att) {

      const parsed = parseQuizTxt(plain).questions;

      state.prevScreen = state.screen;
      state.resultData = {

      };
      state.screen = "RESULT";
      pushNavHistory("RESULT");
      render();
    }

    function printTwoColumnPdf(config, questions, answers) {
      let correct = 0, wrong = 0, skipped = 0;
      const letters = ["A", "B", "C", "D", "E"];
      let qHtml = "";
      questions.forEach((q, idx) => {
        const uAns = answers[idx];
        const color = uAns === q.correctAnswer ? "#10b981" : "#ef4444";
        if (uAns === null || uAns === undefined) skipped++;
        else if (uAns === q.correctAnswer) correct++;
        else wrong++;

        const uText = (uAns !== null && uAns !== undefined) ? `(${letters[uAns]}) ${escHtml(q.options[uAns])}` : "कोई नहीं";
        const cText = `(${letters[q.correctAnswer]}) ${escHtml(q.options[q.correctAnswer])}`;
        const opts = q.options.map((o, i) => `<div>(${letters[i]}) ${escHtml(o)}</div>`).join("");
        qHtml += `
          <div class="print-q-box">
            <div class="print-q-head"><span>Q${idx + 1}.</span><span class="print-q-topic">${escHtml(q.topic)}</span></div>
            <div class="print-q-text">${escHtml(q.text)}</div>
            <div class="print-options-grid">${opts}</div>
            <div class="print-ans-row"><strong>आपका उत्तर:</strong> <span style="color:${color}">${uText}</span></div>
            <div class="print-ans-row"><strong>सही उत्तर:</strong> <span style="color:#10b981">${cText}</span></div>
            <div class="print-sol-box"><strong>व्याख्या:</strong> ${escHtmlWithLinks(q.solution, "#0284c7")}</div>
          </div>`;
      });

      const totalMarks = correct * config.marksPerCorrect - wrong * config.negativeMark;
      const maxMarks = questions.length * config.marksPerCorrect;
      const pct = maxMarks > 0 ? Math.max(0, Math.min(100, (totalMarks / maxMarks) * 100)) : 0;
      const attempted = correct + wrong;
      const acc = attempted > 0 ? Math.round((correct / attempted) * 100) : 0;
      const negInfo = config.negativeMark > 0 ? `-${config.negativeMark.toFixed(2)} Negative` : "No Negative";
      const studentName = state.profile?.name || "Student";

      document.getElementById("print-sheet").innerHTML = `
        <div class="print-header-box">
          <h2>${escHtml(config.title)}</h2>
          <h3>Candidate: ${escHtml(studentName)} | Total Questions: ${questions.length}</h3>
          <p>Marking: +${config.marksPerCorrect.toFixed(2)} / Correct | ${negInfo}</p>
          <div class="print-score-row">
            <span>Score: ${totalMarks.toFixed(2)} / ${maxMarks.toFixed(2)} (${pct.toFixed(1)}%)</span>
            <span>Correct: ${correct}</span>
            <span>Wrong: ${wrong}</span>
            <span>Skipped: ${skipped}</span>
            <span>Accuracy: ${acc}%</span>
          </div>
        </div>
        <div class="two-col-container">${qHtml}</div>`;
      window.print();
    }

    function formatMMSS(sec) {
      const m = String(Math.floor(sec / 60)).padStart(2, "0");
      const s = String(sec % 60).padStart(2, "0");

    function renderResultScreen() {
      const r = state.resultData;
      const letters = ["A", "B", "C", "D", "E"];
      let correct = 0, wrong = 0, skipped = 0;
      r.questions.forEach((q, i) => {
        const a = r.answers[i];
        if (a === null || a === undefined) skipped++;
        else if (a === q.correctAnswer) correct++;
        else wrong++;
      });
      const obtained = correct * r.config.marksPerCorrect - wrong * r.config.negativeMark;
      const maxM = r.questions.length * r.config.marksPerCorrect;
      const pct = maxM > 0 ? Math.max(0, Math.min(100, (obtained / maxM) * 100)) : 0;
      return `
        <div class="test-topbar">
          <button class="btn-outline" style="padding:5px 10px;" onclick="goScreen(state.prevScreen || 'HOME')">← Back</button>
          <div style="font-size:15px;font-weight:900;">EXAM RESULT</div>

      if (state.modal === "CONTACT") {
        return `

    function render() {
      const root = document.getElementById("app");
      let html = "";
      switch (state.screen) {
        case "PROFILE_SETUP": html = renderProfileSetup(); break;
        case "HOME": html = renderHome(); break;
        case "MY_TESTS": html = renderMyTests(); break;
        case "SUBJECT_TESTS": html = renderSubjectTests(); break;
        case "SOLUTIONS": html = renderSolutions(); break;
        case "SETTINGS": html = renderSettings(); break;
        case "CUSTOM_BUILDER": html = renderCustomBuilder(); break;
        case "TEST": html = renderTestScreen(); break;
        case "RESULT": html = renderResultScreen(); break;
      }
      root.innerHTML = html + renderModal();
      renderDesktopSidebar();
      if (state.modal === "PHOTO_CROP" && cropState.img) initCropCanvasInteraction();
    }

    // ==================== 8. ACTION HANDLERS ====================
    window.selectAvatar = (emoji) => {
      if (!state.profile) state.profile = { name: "", districtOrCity: "Rajasthan", targetExam: "RPSC (Rajasthan Public Service Commission)", avatarEmoji: emoji };
      else state.profile.avatarEmoji = emoji;
      render();
    };
    window.setAuthMode = (m) => { state.authMode = m; render(); };

    window.handleResendVerification = async () => {
      if (!state.pendingVerifyToken) return;
      state.authBusy = true;
      render();
      try {
        await fbAuthRequest("accounts:sendOobCode", { requestType: "VERIFY_EMAIL", idToken: state.pendingVerifyToken });
        state.verifyNotice = "✅ Verification Link दोबारा भेज दिया गया है! कृपया अपना Gmail Inbox (या Spam फोल्डर) चेक करें।";
        showToast("Verification email दोबारा भेज दिया गया!");
      } catch (e) {
        alert("Resend Error: " + e.message);
      } finally {
        state.authBusy = false;
        render();
      }
    };

    window.handleCloudLogin = async () => {
      const email = (document.getElementById("auth-email")?.value || "").trim();
      const pass = document.getElementById("auth-pass")?.value || "";
      if (!email || !pass) { alert("कृपया अपनी Email ID और Password दोनों डालें!"); return; }
      state.authBusy = true;
      render();
      try {
        const data = await fbAuthRequest("accounts:signInWithPassword", { email, password: pass, returnSecureToken: true });
        // Mandatory Email Verification Check
        const lookup = await fbAuthRequest("accounts:lookup", { idToken: data.idToken });
        const verified = Boolean(lookup?.users?.[0]?.emailVerified);
        if (!verified) {
          state.pendingVerifyToken = data.idToken;
          state.verifyNotice = "⚠️ आपकी Email (" + data.email + ") अभी Verify नहीं हुई है! कृपया अपना Gmail Inbox / Spam खोलकर Verification Link पर क्लिक करें, फिर दोबारा Login करें।";
          alert("आपकी Email अभी Verify नहीं हुई है! कृपया ईमेल में आए लिंक पर क्लिक करें।");
          return;
        }

        state.pendingVerifyToken = "";
        state.verifyNotice = "";
        state.auth = { uid: data.localId, email: data.email, idToken: data.idToken, refreshToken: data.refreshToken };
        saveJson(LS_AUTH, state.auth);

        const pending = loadJson(LS_PENDING_PROFILE, null);
        const defaultProf = (pending && pending.email === data.email) ? {
          ...pending,
          uid: data.localId,
          studentId: pending.studentId || generateStudentId(data.localId)
        } : {
          uid: data.localId,
          studentId: generateStudentId(data.localId),
          name: email.split("@")[0],
          email: data.email,
          districtOrCity: "Rajasthan",
          targetExam: "RPSC (Rajasthan Public Service Commission)",
          avatarEmoji: "🎓"
        };
        state.profile = defaultProf;
        saveJson(LS_PROFILE, state.profile);
        state.selectedExam = normalizeExamCode(state.profile.targetExam || "RPSC");

        await fbPullUserData();
        // If this was first verified login, push pending profile to cloud DB
        if (pending && pending.email === data.email) {
          await fbPushProfileAndAttempts();
          localStorage.removeItem(LS_PENDING_PROFILE);
        }
        showToast("लॉगिन सफल! प्रोफाइल व मार्क्स सिंक हो गए।");
        fetchOnlineQuizzes();
        goScreen("HOME");
      } catch (e) {
        alert("Login Error: " + e.message);
      } finally {
        state.authBusy = false;
        render();
      }
    };

    window.handleForgotPassword = async () => {
      const email = (document.getElementById("auth-email")?.value || "").trim();
      if (!email) { alert("कृपया ऊपर अपनी Email ID लिखें, फिर Forgot Password दबाएं।"); return; }
      try {
        await fbAuthRequest("accounts:sendOobCode", { requestType: "PASSWORD_RESET", email });
        alert("पासवर्ड रीसेट लिंक आपकी Email (" + email + ") पर भेज दिया गया है! (Spam फोल्डर भी चेक करें)");
      } catch (e) {
        alert("Error: " + e.message);
      }
    };

    window.saveProfileForm = async () => {
      const name = document.getElementById("prof-name").value.trim();
      const email = (document.getElementById("prof-email")?.value || "").trim();
      const passEl = document.getElementById("prof-pass");
      const pass = passEl ? passEl.value : "";
      const city = document.getElementById("prof-city").value.trim() || "Rajasthan";
      const exam = document.getElementById("prof-exam").value;
      if (!name) { alert("कृपया अपना नाम लिखें!"); return; }
      const avatar = state.profile?.avatarEmoji || "🎓";

      if (isFirebaseConfigured() && !state.auth?.uid) {
        if (!email || !email.includes("@")) { alert("कृपया अपनी सही Email ID डालें!"); return; }
        if (pass.length < 6) { alert("कृपया कम से कम 6 अक्षरों का Password बनाएं!"); return; }
        state.authBusy = true;
        render();
        try {
          const data = await fbAuthRequest("accounts:signUp", { email, password: pass, returnSecureToken: true });
          const sid = generateStudentId(data.localId);
          // Save chosen profile details locally so they sync to Firebase right after email verification + first login
          saveJson(LS_PENDING_PROFILE, { uid: data.localId, studentId: sid, name, email: data.email, districtOrCity: city, targetExam: exam, avatarEmoji: avatar });
          // Set Firebase displayName so verification email greets student by name ("Hello <Name>,")
          try {
            await fbAuthRequest("accounts:update", { idToken: data.idToken, displayName: name, returnSecureToken: false });
          } catch {}
          await fbAuthRequest("accounts:sendOobCode", { requestType: "VERIFY_EMAIL", idToken: data.idToken });
          state.pendingVerifyToken = data.idToken;
          state.verifyNotice = "📧 अकाउंट बन गया! आपकी Email (" + data.email + ") पर Verification Link भेज दिया गया है। पहले लिंक पर क्लिक करें, फिर नीचे Login करें।";
          state.authMode = "LOGIN";
          alert("अकाउंट बन गया! कृपया अपनी Email (" + data.email + ") खोलकर Verification Link पर क्लिक करें, फिर Login करें।");
        } catch (e) {
          alert("Sign Up Error: " + e.message);
        } finally {
          state.authBusy = false;
          render();
        }
        return;
      }

      const uid = state.auth?.uid || state.profile?.uid || "";
      const sid = state.profile?.studentId || (uid ? generateStudentId(uid) : generateStudentId(email || name));
      state.profile = { uid, studentId: sid, name, email: email || state.auth?.email || "", districtOrCity: city, targetExam: exam, avatarEmoji: avatar };
      saveJson(LS_PROFILE, state.profile);
      state.selectedExam = normalizeExamCode(exam);
      if (isFirebaseConfigured() && state.auth?.uid) {
        fbPushProfileAndAttempts();
      }
      goScreen("HOME");
    };

    window.logoutAccount = () => {
      if (confirm("क्या आप लॉगआउट करना चाहते हैं? आपके मार्क्स क्लाउड में सुरक्षित हैं, दोबारा लॉगिन करने पर वापस मिल जाएंगे।")) {
        localStorage.removeItem(LS_AUTH);
        localStorage.removeItem(LS_PROFILE);
        localStorage.removeItem(LS_ATTEMPTS);
        localStorage.removeItem(LS_RESUME);
        localStorage.removeItem(LS_INDEX_CACHE);
        localStorage.removeItem(LS_LOCAL_PHOTO);
        try { sessionStorage.removeItem("web_mock_active_test"); } catch {}
        state.auth = null;
        state.profile = null;
        state.attemptsMap = {};
        state.resumeState = null;
        state.onlineQuizzes = [];
        state.authMode = "LOGIN";
        goScreen("PROFILE_SETUP");
      }
    };
    window.pickExam = (code) => {
      state.selectedExam = normalizeExamCode(code);
      state.subjectFilterChip = "ALL";
      goScreen("MY_TESTS");
    };
    window.openSubject = (subName) => {
      state.selectedSubject = subName;
      goScreen("SUBJECT_TESTS");
    };
    window.setSubjectChip = (chip) => {
      state.subjectFilterChip = chip;
      render();
    };
    window.setSolutionsTab = (tab) => {
      state.solutionsTab = tab;
      render();
    };
    window.launchById = (id) => {
      const meta = state.onlineQuizzes.find(q => q.id === id);
      if (meta) launchOnlineQuiz(meta);
    };
    window.resumeOrStart = () => {
      if (state.resumeState) {
        const r = state.resumeState;
        const plain = localStorage.getItem(LS_QUIZ_CACHE_PREFIX + r.config.id + "_plain");
        if (plain) {
          const qs = parseQuizTxt(plain).questions;
          if (qs.length) {
            state.prevScreen = "HOME";
            state.activeTest = { config: r.config, questions: qs, rawTxt: plain, currentQ: r.currentQ || 0, answers: r.answers, review: r.review, remainingSec: Math.max(1, r.remainingSec) };
            state.screen = "TEST";
            pushNavHistory("TEST");
            startTimer();
            render();
            return;
          }
        }
      }
      goScreen("MY_TESTS");
    };
    window.selectOption = (idx) => { state.activeTest.answers[state.activeTest.currentQ] = idx; persistResume(); render(); };
    window.toggleReview = () => { state.activeTest.review[state.activeTest.currentQ] = !state.activeTest.review[state.activeTest.currentQ]; persistResume(); render(); };
    window.prevQ = () => { if (state.activeTest.currentQ > 0) { state.activeTest.currentQ--; persistResume(); render(); window.scrollTo(0, 0); } };
    window.nextQ = () => { if (state.activeTest.currentQ < state.activeTest.questions.length - 1) { state.activeTest.currentQ++; persistResume(); render(); window.scrollTo(0, 0); } };
    window.jumpToQ = (i) => { state.activeTest.currentQ = i; state.modal = null; persistResume(); render(); window.scrollTo(0, 0); };
    window.pauseTestInPlace = () => {
      if (state.screen !== "TEST" || !state.activeTest) return;
      state.isPaused = true;
      stopTimer();
      persistResume();
      state.modal = "PAUSED";
      render();
    };
    window.resumePausedTest = () => {
      if (state.screen !== "TEST" || !state.activeTest) return;
      state.isPaused = false;
      state.modal = null;
      startTimer();
      render();
    };
    window.pauseAndExitTest = () => {
      persistResume();
      stopTimer();
      state.isPaused = false;
      state.modal = null;
      try { sessionStorage.removeItem("web_mock_active_test"); } catch {}
      goScreen(state.prevScreen || "HOME");
    };
    window.confirmSubmit = () => { if (confirm("क्या आप वाकई परीक्षा सबमिट करना चाहते हैं?")) finishExam(); };
    window.openModal = (m) => { state.modal = m; render(); };
    function renderTestDescHtml(subtitle, uidKey) {
      const txt = String(subtitle || "").trim();
      if (!txt || txt === "Online Practice Test") return "";
      const safeId = String(uidKey).replace(/[^a-zA-Z0-9_-]/g, "_");
      const needsMore = txt.length > 110 || txt.split("\n").length > 3;
      return `<div class="test-desc" id="desc-${safeId}">${escHtml(txt)}</div>` +
        (needsMore ? `<button type="button" class="read-more-btn" onclick="event.stopPropagation();toggleDescExpand('${safeId}', this)">Read more ▾</button>` : "");
    }
    window.toggleDescExpand = (safeId, btn) => {
      const el = document.getElementById("desc-" + safeId);
      if (!el) return;
      const expanded = el.classList.toggle("expanded");
      btn.textContent = expanded ? "Show less ▴" : "Read more ▾";
    };
    window.triggerLocalPhotoPick = () => {
      const inp = document.getElementById("local-avatar-input");
      if (inp) { inp.value = ""; inp.click(); }
    };
    window.removeLocalPhoto = () => {
      try { localStorage.removeItem(LS_LOCAL_PHOTO); } catch {}
      showToast("कस्टम प्रोफाइल फोटो हटा दी गई।");
      render();
    };
    window.onLocalPhotoPicked = (ev) => {
      const file = ev.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          cropState = { img, zoom: 1, ox: 0, oy: 0, dragging: false, lastX: 0, lastY: 0 };
          state.modal = "PHOTO_CROP";
          render();
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    };
    function drawCropCanvas(canvas, outSize) {
      const img = cropState.img;
      if (!canvas || !img) return;
      const ctx = canvas.getContext("2d");
      const sz = outSize || canvas.width;
      ctx.clearRect(0, 0, sz, sz);
      const baseScale = Math.max(sz / img.width, sz / img.height);
      const scale = baseScale * cropState.zoom;
      const drawW = img.width * scale;
      const drawH = img.height * scale;
      const ratio = sz / 220;
      const maxOx = Math.max(0, (drawW - sz) / 2);
      const maxOy = Math.max(0, (drawH - sz) / 2);
      const dx = Math.max(-maxOx, Math.min(maxOx, cropState.ox * ratio));
      const dy = Math.max(-maxOy, Math.min(maxOy, cropState.oy * ratio));
      const x = (sz - drawW) / 2 + dx;
      const y = (sz - drawH) / 2 + dy;
      ctx.drawImage(img, x, y, drawW, drawH);
    }
    function initCropCanvasInteraction() {
      const canvas = document.getElementById("crop-preview-canvas");
      if (!canvas) return;
      drawCropCanvas(canvas, 220);
      canvas.onpointerdown = (e) => {
        cropState.dragging = true;
        cropState.lastX = e.clientX;
        cropState.lastY = e.clientY;
        try { canvas.setPointerCapture(e.pointerId); } catch {}
      };
      canvas.onpointermove = (e) => {
        if (!cropState.dragging) return;
        const dx = e.clientX - cropState.lastX;
        const dy = e.clientY - cropState.lastY;
        cropState.lastX = e.clientX;
        cropState.lastY = e.clientY;
        const maxShift = 110 * cropState.zoom;
        cropState.ox = Math.max(-maxShift, Math.min(maxShift, cropState.ox + dx));
        cropState.oy = Math.max(-maxShift, Math.min(maxShift, cropState.oy + dy));
        drawCropCanvas(canvas, 220);
      };
      canvas.onpointerup = () => { cropState.dragging = false; };
      canvas.onpointercancel = () => { cropState.dragging = false; };
    }
    window.onCropZoomChange = (val) => {
      cropState.zoom = parseFloat(val) || 1;
      const canvas = document.getElementById("crop-preview-canvas");
      if (canvas) drawCropCanvas(canvas, 220);
    };
    window.saveCroppedLocalPhoto = () => {
      if (!cropState.img) return;
      const out = document.createElement("canvas");
      out.width = 256;
      out.height = 256;
      drawCropCanvas(out, 256);
      const dataUrl = out.toDataURL("image/jpeg", 0.78);
      try {
        localStorage.setItem(LS_LOCAL_PHOTO, dataUrl);
      } catch (e) {
        alert("ब्राउज़र स्टोरेज भर गया है, कृपया Settings से पुराना कैश साफ़ करें।");
        return;
      }
      const approxKb = Math.max(1, Math.round((dataUrl.length * 0.75) / 1024));
      cropState.img = null;
      state.modal = null;
      showToast(`✅ प्रोफाइल फोटो सेव हो गई (${approxKb} KB)!`);
      render();
    };
    window.toggleWebsiteTheme = () => {
      const next = document.body.classList.contains("light-theme") ? "dark" : "light";
      applyTheme(next);
      showToast(next === "light" ? "☀️ Light Theme चालू हो गई!" : "🌙 Dark Theme चालू हो गई!");
      render();
    };
    window.closeModal = () => { state.modal = null; render(); };
    window.openSavedByQuizId = (quizId, idx) => { const att = (state.attemptsMap[quizId] || [])[idx]; if (att) openSavedAttempt(att); };
    window.openSavedFromAll = (idx) => { const att = getAllAttemptsSorted()[idx]; if (att) openSavedAttempt(att); };
    window.printSavedFromAll = async (idx) => {
      const att = getAllAttemptsSorted()[idx];
      if (!att) return;
      const plain = await ensureQuizPlainText(att.config.id);
      if (!plain) { alert("PDF के लिए प्रश्न लोड नहीं हो सके, कृपया इंटरनेट चेक करें।"); return; }
      const qs = parseQuizTxt(plain).questions;
      if (qs.length) printTwoColumnPdf(att.config, qs, att.answers);
    };
    window.printActiveResult = () => {
      if (state.resultData) printTwoColumnPdf(state.resultData.config, state.resultData.questions, state.resultData.answers);
    };
    window.retakeActiveResult = () => {
      const r = state.resultData;
      if (!r) return;
      const plain = localStorage.getItem(LS_QUIZ_CACHE_PREFIX + r.config.id + "_plain") || "";
      startExamSession(r.config, r.questions, plain);
    };
    window.handleCustomTxtFile = (ev) => {
      const file = ev.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => { document.getElementById("cust-raw").value = reader.result || ""; };
      reader.readAsText(file, "UTF-8");
    };
    window.startCustomQuizFromForm = () => {
      const examName = document.getElementById("cust-exam").value;
      const subject = document.getElementById("cust-sub").value.trim() || "General";
      const title = document.getElementById("cust-title").value.trim() || "Custom Mock Test";
      const timeMinutes = parseInt(document.getElementById("cust-time").value, 10) || 60;
      const marksPerCorrect = parseFloat(document.getElementById("cust-marks").value) || 2.0;
      const negativeMark = parseFloat(document.getElementById("cust-neg").value) || 0.0;
      const rawTxt = document.getElementById("cust-raw").value;
      const res = parseQuizTxt(rawTxt);
      if (!res.questions.length) { alert("कृपया सही प्रश्नों और ANS: वाला टेक्स्ट या .txt फाइल डालें!"); return; }
      const cfg = { id: "custom_" + Math.abs(rawTxt.split("").reduce((a, c) => ((a << 5) - a + c.charCodeAt(0)) | 0, 0)), title, examName, subject, timeMinutes, marksPerCorrect, negativeMark };
      saveJson(LS_CUSTOM_CFG, cfg);
      startExamSession(cfg, res.questions, rawTxt);
    };
    window.clearAllData = () => {
      if (confirm("क्या आप वाकई ब्राउज़र से सभी स्कोर और कैश हटाना चाहते हैं?")) {
        localStorage.clear();
        state.attemptsMap = {};
        state.resumeState = null;
        state.profile = null;
        goScreen("PROFILE_SETUP");
      }
    };

    // Auto-pause timer when user switches browser tab or minimizes phone browser
    document.addEventListener("visibilitychange", () => {
      if (document.hidden && state.screen === "TEST" && state.activeTest && !state.isPaused) {
        window.pauseTestInPlace();
      }
    });
    window.addEventListener("beforeunload", (e) => {
      if (state.screen === "TEST" && state.activeTest) {
        persistResume();
        e.preventDefault();
        e.returnValue = "";
      }
    });
    window.addEventListener("pagehide", () => {
      if (state.screen === "TEST" && state.activeTest) {
        persistResume();
        stopTimer();
      }
    });

    // Phone Back Button / Browser Back Handler (Prevents accidental website close!)
    try {
      window.history.replaceState({ appScreen: state.screen, root: true }, "");
      window.history.pushState({ appScreen: state.screen, guard: true }, "");
    } catch {}

    window.addEventListener("popstate", () => {
      // 1. If any popup/modal is open (except PAUSED), close it first
      if (state.modal && state.modal !== "PAUSED") {
        state.modal = null;
        pushNavHistory(state.screen);
        render();
        return;
      }

      // 2. On TEST screen: pause test instead of closing website!
      if (state.screen === "TEST") {
        pushNavHistory("TEST");
        if (!state.isPaused) {
          window.pauseTestInPlace();
        } else {
          showToast("बाहर जाने के लिए 'Save & Exit to Home' दबाएं");
        }
        return;
      }

      // 3. Navigate back screen-by-screen inside the website
      if (state.screen === "RESULT") {
        goScreen(state.prevScreen || "HOME", true);
        pushNavHistory(state.screen);
        return;
      }
      if (state.screen === "SUBJECT_TESTS") {
        goScreen("MY_TESTS", true);
        pushNavHistory("MY_TESTS");
        return;
      }
      if (state.screen !== "HOME" && state.screen !== "PROFILE_SETUP") {
        goScreen("HOME", true);
        pushNavHistory("HOME");
        return;
      }
      if (state.screen === "PROFILE_SETUP" && state.profile) {
        goScreen("HOME", true);
        pushNavHistory("HOME");
        return;
      }

      // 4. Already on HOME: require double Back press within 2 seconds to exit
      const now = Date.now();
      if (now - state.lastBackPress < 2000) {
        window.history.back();
      } else {
        state.lastBackPress = now;
        pushNavHistory("HOME");
        showToast("वेबसाइट बंद करने के लिए दोबारा Back दबाएं");
      }
    });

    // Auto-restore active test if browser accidentally refreshed mid-test
    try {
      if (sessionStorage.getItem("web_mock_active_test") === "1" && state.resumeState) {
        const r = state.resumeState;
        const plain = localStorage.getItem(LS_QUIZ_CACHE_PREFIX + r.config.id + "_plain");
        if (plain) {
          const qs = parseQuizTxt(plain).questions;
          if (qs.length) {
            state.prevScreen = "HOME";
            state.activeTest = {
              config: r.config,
              questions: qs,
              rawTxt: plain,
              currentQ: r.currentQ || 0,
              answers: r.answers,
              review: r.review,
              remainingSec: Math.max(1, r.remainingSec)
            };
            state.screen = "TEST";
            pushNavHistory("TEST");
            startTimer();
          }
        }
      }
    } catch {}

    // Init
    render();
    fetchOnlineQuizzes();
    if (isFirebaseConfigured() && state.auth?.uid) {
      fbPullUserData();
    }
  </script>
</body>
</html>
